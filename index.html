<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,user-scalable=no"/>
<title>Brotato</title>
<!-- Local Icons -->
<link rel="icon" type="image/png" href="index.icon.png"/>
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<!-- Google Font: Chewy -->
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#06060f;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:#e2e2e2;
  height:100vh;overflow:hidden;
  touch-action:none;
}

canvas{
  display:block;position:fixed;inset:0;
  width:100%;height:100%;border:none;
  background:#000;
}
canvas:focus{outline:none}

/* ─── Loader wrapper with background.png ─── */
#loader{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  padding:20px;overflow:hidden;
  background: linear-gradient(rgba(6, 6, 15, 0.8), rgba(6, 6, 15, 0.9)), url('background.png') no-repeat center center/cover;
  transition:opacity 0.7s ease;
}

/* ─── Background glowing blobs (Purple & Green theme) ─── */
.blob{
  position:absolute;border-radius:50%;
  filter:blur(90px);pointer-events:none;
}
.b1{width:520px;height:520px;top:-160px;left:-160px;
    background:radial-gradient(circle,rgba(168,85,247,0.15),transparent 70%);
    animation:blobA 13s ease-in-out infinite alternate}
.b2{width:420px;height:420px;bottom:-120px;right:-120px;
    background:radial-gradient(circle,rgba(74,222,128,0.12),transparent 70%);
    animation:blobB 16s ease-in-out infinite alternate}
.b3{width:320px;height:320px;top:45%;left:55%;
    background:radial-gradient(circle,rgba(147,51,234,0.1),transparent 70%);
    animation:blobA 10s ease-in-out infinite alternate-reverse}

@keyframes blobA{from{transform:translate(0,0) scale(1)}to{transform:translate(35px,25px) scale(1.12)}}
@keyframes blobB{from{transform:translate(0,0) scale(1)}to{transform:translate(-25px,35px) scale(1.08)}}

.grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.016) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.016) 1px,transparent 1px);
  background-size:54px 54px;
}

/* ─── Content ─── */
.content{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  align-items:center;gap:18px;
  width:100%;max-width:490px;
}

/* ─── Title (Chewy Font & Purple-Green Gradient) ─── */
.game-title{text-align:center}
.title-text{
  font-family: 'Chewy', cursive, sans-serif;
  font-size:clamp(3rem,9vw,4.2rem);
  letter-spacing:0.08em;
  text-transform:uppercase;
  background:linear-gradient(135deg,#c084fc 0%, #a855f7 40%, #4ade80 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:titleGlow 3s ease-in-out infinite alternate;
  line-height:1;padding-bottom:3px;
}
@keyframes titleGlow{
  from{filter:drop-shadow(0 0 8px rgba(168,85,247,0.4))}
  to{filter:drop-shadow(0 0 25px rgba(74,222,128,0.6)) drop-shadow(0 0 50px rgba(168,85,247,0.3))}
}
.title-sub{
  margin-top:8px;font-size:0.6rem;
  letter-spacing:0.4em;text-transform:uppercase;
  color:rgba(255,255,255,0.3);
}

/* ─── Cards ─── */
.cards{display:flex;flex-direction:column;gap:8px;width:100%}

.card{
  background:rgba(20, 10, 30, 0.6);
  border:1px solid rgba(168,85,247,0.15);
  border-radius:14px;padding:14px 18px;
  position:relative;overflow:hidden;
  backdrop-filter: blur(10px);
  transition:border-color 0.4s,background 0.4s;
}
.card.active {border-color:rgba(168,85,247,0.4)}
.card.done   {border-color:rgba(74,222,128,0.4);background:rgba(20,30,20,0.6)}
.card.fail   {border-color:rgba(255,82,82,0.4);background:rgba(255,82,82,0.04)}

.card-glow{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity 0.4s;border-radius:14px;
}
